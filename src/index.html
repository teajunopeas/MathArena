<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1e8" />
    <title>MathArena — practice space</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="MathArena home"><span class="brand-mark">M</span>MathArena</a>
      <span class="top-note">A space to think</span>
    </header>
    <main class="layout">
      <section class="intro">
        <p class="eyebrow">PRACTICE SPACE</p>
        <h1>One problem.<br /><em>All the time.</em></h1>
        <p class="intro-copy">Choose a topic, take your time, and discover the way when you are ready.</p>
      </section>
      <section class="practice" aria-label="Problem practice">
        <div class="filters">
          <label>Topic <select id="topic-filter"><option value="all">All topics</option></select></label>
          <label>Level <select id="difficulty-filter"><option value="all">Any level</option><option value="introductorio">Beginner</option><option value="intermedio">Intermediate</option><option value="avanzado">Advanced</option></select></label>
          <span class="count" id="problem-count" aria-live="polite"></span>
        </div>
        <article class="problem-card">
          <div class="problem-meta"><span id="problem-number">PROBLEM</span><span id="difficulty-badge" class="badge"></span></div>
          <h2 id="problem-statement">Loading problems…</h2>
          <div class="topic-list" id="topic-list"></div>
          <form id="answer-form" class="answer-form">
            <label for="answer-input">Your answer</label>
            <div class="answer-row"><input id="answer-input" type="text" inputmode="decimal" placeholder="Enter a number" autocomplete="off" /><button class="button button-primary" type="submit">Check</button></div>
            <p id="feedback" class="feedback" aria-live="polite"></p>
          </form>
          <div class="solution-area"><button id="solution-toggle" class="text-button" type="button">Show solution <span aria-hidden="true">↗</span></button><div id="solution" class="solution" hidden></div></div>
        </article>
        <div class="next-row"><span class="quiet">Solve at your own pace.</span><button id="next-button" class="button button-secondary" type="button">Another problem <span aria-hidden="true">→</span></button></div>
      </section>
      <footer>Local prototype · Small, reviewable catalog</footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
